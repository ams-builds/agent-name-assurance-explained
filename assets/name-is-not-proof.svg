<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">A name is not proof</title>
<desc id="desc">A chain of five parts: the agent name, the proof of binding, the cryptographic ID, the Agent Page, and a visitor who decides whether to trust it. The proof of binding carries the trust. Below, three questions that every claim answers: the tier, the profile, and the assurance level.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="480" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">A Name Is Not Proof</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">TRUST COMES FROM THE PROOF BEHIND THE NAME</text>
<rect x="40" y="104" width="184" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="48" y="112" width="30" height="16" rx="4" fill="#ececec"/>
<text x="63.0" y="124" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="132.0" y="142.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Agent Name</text>
<text x="132.0" y="156.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">a friendly label</text>
<text x="132.0" y="168.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">example: travel-helper</text>
<rect x="274" y="104" width="184" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="282" y="112" width="30" height="16" rx="4" fill="#ececec"/>
<text x="297.0" y="124" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="366.0" y="142.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Proof of Binding</text>
<text x="366.0" y="156.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">links the name to a key</text>
<text x="366.0" y="168.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">signed and checkable</text>
<line x1="224" y1="152.0" x2="270" y2="152.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="508" y="104" width="184" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="516" y="112" width="30" height="16" rx="4" fill="#ececec"/>
<text x="531.0" y="124" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="600.0" y="142.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Cryptographic ID</text>
<text x="600.0" y="156.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">a DID</text>
<text x="600.0" y="168.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">holds the public keys</text>
<line x1="458" y1="152.0" x2="504" y2="152.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="742" y="104" width="184" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="750" y="112" width="30" height="16" rx="4" fill="#ececec"/>
<text x="765.0" y="124" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="834.0" y="142.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Agent Page</text>
<text x="834.0" y="156.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">where the agent lives</text>
<text x="834.0" y="168.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">endpoints and contact</text>
<line x1="692" y1="152.0" x2="738" y2="152.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="976" y="104" width="184" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="984" y="112" width="54" height="16" rx="4" fill="#ececec"/>
<text x="1011.0" y="124" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">VISITOR</text>
<text x="1068.0" y="142.9" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Visitor Decides</text>
<text x="1068.0" y="156.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">checks the proof</text>
<text x="1068.0" y="168.9" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">then trusts it, or not</text>
<line x1="926" y1="152.0" x2="972" y2="152.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="40" y="236" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">THREE QUESTIONS EVERY CLAIM ANSWERS</text>
<rect x="40" y="252" width="360" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="220.0" y="281.3" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Tier</text>
<text x="220.0" y="295.3" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">AN-0 to AN-3</text>
<text x="220.0" y="307.3" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">how strong is the proof?</text>
<rect x="420" y="252" width="360" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="600.0" y="281.3" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Profile</text>
<text x="600.0" y="295.3" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">Core, Deploy, Transact, Enterprise</text>
<text x="600.0" y="307.3" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">what can the agent do?</text>
<rect x="800" y="252" width="360" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="980.0" y="281.3" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Assurance Level</text>
<text x="980.0" y="295.3" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">AL1 to AL4</text>
<text x="980.0" y="307.3" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">how good is the evidence?</text>
<line x1="40" y1="368" x2="1160" y2="368" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="394" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">WHO</text>
<rect x="120" y="382" width="30" height="16" rx="4" fill="#ececec"/>
<text x="135.0" y="394" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="160" y="394" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a part you publish</text>
<rect x="640" y="382" width="54" height="16" rx="4" fill="#ececec"/>
<text x="667.0" y="394" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">VISITOR</text>
<text x="704" y="394" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a person or agent that wants to trust your agent</text>
<text x="40" y="426" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">FLOW</text>
<line x1="120" y1="422" x2="150" y2="422" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="160" y="426" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">next link in the chain</text>
<rect x="640" y="416" width="24" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="676" y="427" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">the part that carries the trust</text>
</svg>
