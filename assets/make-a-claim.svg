<rect x="816" y="128" width="36" height="16" rx="4" fill="#ececec"/>
<text x="834.0" y="140" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">TOOL</text>
<text x="888.0" y="160.6" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Validate</text>
