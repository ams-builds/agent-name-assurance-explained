<rect x="640" y="352" width="240" height="60" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="760.0" y="382.1" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Fail Safe</text>
<text x="760.0" y="396.1" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">do not raise trust</text>
<line x1="1000" y1="382" x2="884" y2="382" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="940" y="368" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#7a8399">missing or stale</text>
<line x1="40" y1="450" x2="1160" y2="450" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
