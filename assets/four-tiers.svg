<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Four tiers of proof</title>
<desc id="desc">Four steps, from AN-0 Self-Asserted to AN-3 High Assurance Verified. Each step needs stronger proof and faster revocation checks. One rule applies to all tiers: show the real tier, never one generic Verified badge.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/>
  </marker>
</defs>
<rect x="0" y="0" width="1200" height="540" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Four Tiers of Proof</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">HIGHER TIER: STRONGER PROOF, FASTER REVOCATION CHECKS</text>
<rect x="40" y="330" width="250" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="48" y="338" width="36" height="16" rx="4" fill="#ececec"/>
<text x="66.0" y="350" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">WEAK</text>
<text x="165.0" y="380.6" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">AN-0 Self-Asserted</text>
<text x="165.0" y="394.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">proof: the DID includes the name</text>
<text x="165.0" y="406.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">revocation: none</text>
<rect x="330" y="266" width="250" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="338" y="274" width="48" height="16" rx="4" fill="#ececec"/>
<text x="362.0" y="286" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">MEDIUM</text>
<text x="455.0" y="316.6" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">AN-1 Domain-Control Verified</text>
<text x="455.0" y="330.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">proof: you control the web domain</text>
<text x="455.0" y="342.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">check again every 90 days or less</text>
<line x1="290" y1="378.0" x2="326" y2="314.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="620" y="202" width="250" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="628" y="210" width="48" height="16" rx="4" fill="#ececec"/>
<text x="652.0" y="222" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">STRONG</text>
<text x="745.0" y="252.6" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">AN-2 Trust Framework Verified</text>
<text x="745.0" y="266.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">proof: credential from a known issuer</text>
<text x="745.0" y="278.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">revocation: continuous checks</text>
<line x1="580" y1="314.0" x2="616" y2="250.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="910" y="138" width="250" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="918" y="146" width="78" height="16" rx="4" fill="#ececec"/>
<text x="957.0" y="158" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">VERY STRONG</text>
<text x="1035.0" y="188.6" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">AN-3 High Assurance Verified</text>
<text x="1035.0" y="202.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">proof: legal entity + security checks</text>
<text x="1035.0" y="214.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">real-time revocation + public log</text>
<line x1="870" y1="250.0" x2="906" y2="186.0" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="620" y="354" width="540" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="628" y="362" width="36" height="16" rx="4" fill="#ececec"/>
<text x="646.0" y="374" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">RULE</text>
<text x="890.0" y="394.6" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Show the Real Tier</text>
<text x="890.0" y="408.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">never one generic "Verified" badge</text>
<text x="890.0" y="420.6" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8.5" fill="#4f5d75">rules ANAGB-UI-01 and ANAGB-UI-02, all tiers</text>
<line x1="40" y1="456" x2="1160" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="482" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">CHIP</text>
<rect x="120" y="470" width="36" height="16" rx="4" fill="#ececec"/>
<text x="138.0" y="482" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">WEAK</text>
<text x="166" y="482" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">how strong the link between the name and the key is</text>
<text x="40" y="512" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">FLOW</text>
<line x1="120" y1="508" x2="150" y2="508" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="160" y="512" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">next tier up</text>
<rect x="320" y="502" width="24" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="356" y="513" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a rule for every tier</text>
</svg>
